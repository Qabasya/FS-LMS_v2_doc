<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Служебные страницы — FS-LMS 2.0</title>
<link rel="stylesheet" href="_shared.css">
<script src="_nav.js"></script>
<style>
  body{background:var(--gray0)}
  .demo-bar{position:fixed;top:12px;right:12px;background:#fff;border:1px solid var(--gray2);border-radius:var(--r-8);
    box-shadow:var(--sh);padding:var(--sp-8) var(--sp-12);display:flex;gap:var(--sp-12);align-items:center;
    font-size:var(--fs-12);color:var(--gray6);flex-wrap:wrap;z-index:60;max-width:min(620px,92vw)}
  .demo-bar select{padding:var(--sp-4) var(--sp-8);font-size:var(--fs-12);border:1px solid var(--gray3);border-radius:var(--r-4)}
  .demo-bar label{display:flex;gap:var(--sp-4);align-items:center;white-space:nowrap;cursor:pointer}

  /* ── страница-ошибка ── */
  .stage{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:var(--sp-32) var(--sp-16);text-align:center}
  .err-card{width:min(560px,100%)}
  .code{font-size:var(--fs-32);font-weight:700;color:var(--gray3);letter-spacing:.08em;margin-bottom:var(--sp-8)}
  .err-card h1{margin:0 0 var(--sp-12);font-size:var(--fs-22)}
  .err-card p{margin:0 0 var(--sp-20);color:var(--gray6);font-size:var(--fs-14);line-height:1.6}
  .acts{display:flex;gap:var(--sp-12);justify-content:center;flex-wrap:wrap}
  .ref{margin-top:var(--sp-24);font-size:var(--fs-12);color:var(--gray5)}
  .ref code{font-family:ui-monospace,Menlo,monospace;background:#fff;border:1px solid var(--gray2);
    border-radius:var(--r-4);padding:var(--sp-4) var(--sp-8)}
  .ill{width:64px;height:64px;border-radius:var(--r-14);display:grid;place-items:center;margin:0 auto var(--sp-16);
    font-size:var(--fs-26);background:var(--gray1);color:var(--gray5)}
  .ill.warn{background:var(--orange-l);color:#d9480f}
  .ill.stop{background:var(--red-l);color:#c92a2a}
  .ill.info{background:var(--blue-l);color:#1864ab}

  /* ── деградация: рабочая рамка с плашкой ── */
  .shell-demo{display:flex;min-height:100vh}
  .side-demo{width:250px;background:#fff;border-right:1px solid var(--gray2);flex:none;display:flex;flex-direction:column}
  .side-top-demo{height:var(--head-h);border-bottom:1px solid var(--gray2);display:flex;align-items:center;
    gap:var(--sp-12);padding:0 var(--sp-16)}
  .side-top-demo .logo{width:34px;height:34px;border-radius:var(--r-8);background:var(--blue);color:#fff;
    display:grid;place-items:center;font-weight:700;font-size:var(--fs-12)}
  .nav-demo{padding:var(--sp-12) var(--sp-8);flex:1}
  .nav-demo h4{margin:var(--sp-12) var(--sp-12) var(--sp-4);font-size:var(--fs-12);text-transform:uppercase;
    letter-spacing:.05em;color:var(--gray5)}
  .nav-demo a{display:flex;gap:var(--sp-12);align-items:center;padding:var(--sp-8) var(--sp-12);border-radius:var(--r-6);
    color:var(--gray7);text-decoration:none;font-size:var(--fs-14)}
  .nav-demo a:hover{background:var(--gray1)}
  .nav-demo a.off{color:var(--gray4);cursor:not-allowed;position:relative}
  .nav-demo a.off:hover{background:none}
  .nav-demo a.off .lockic{margin-left:auto;font-size:var(--fs-12);color:var(--gray4)}
  .app-demo{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--gray0)}
  .head-demo{height:var(--head-h);background:#fff;border-bottom:1px solid var(--gray2);display:flex;align-items:center;
    gap:var(--sp-16);padding:0 var(--sp-20);flex:none}
  .head-demo h1{margin:0;font-size:var(--fs-16)}
  .body-demo{flex:1;overflow:auto;padding:var(--sp-16) var(--sp-20)}

  .banner{border-radius:var(--r-8);padding:var(--sp-12) var(--sp-16);font-size:var(--fs-14);margin-bottom:14px;
    display:flex;gap:var(--sp-12);align-items:flex-start;line-height:1.55}
  .banner.warn{background:var(--orange-l);border:1px solid #ffd8a8;color:#d9480f}
  .banner.stop{background:var(--red-l);border:1px solid #ffc9c9;color:#c92a2a}
  .banner b{display:block}
  .banner .ic{font-size:var(--fs-16);flex:none;line-height:1.3}

  .card{background:#fff;border:1px solid var(--gray2);border-radius:var(--r-12);box-shadow:var(--sh);
    padding:var(--sp-16) var(--sp-20);margin-bottom:14px}
  .card h3{margin:0 0 var(--sp-8);font-size:var(--fs-14)}
  .card p{margin:0;color:var(--gray6);font-size:var(--fs-14);line-height:1.55}
  .muted-block{opacity:.45;pointer-events:none;filter:grayscale(1)}

  /* ── панель колокольчика ── */
  .bell-wrap{position:relative;margin-left:auto}
  .bell{border:1px solid var(--gray2);background:#fff;border-radius:var(--r-8);width:38px;height:38px;
    display:grid;place-items:center;font-size:var(--fs-16);position:relative}
  .bell:hover{background:var(--gray0)}
  .bell .cnt{position:absolute;top:-5px;right:-5px;background:var(--blue);color:#fff;border-radius:var(--r-pill);
    font-size:var(--fs-12);font-weight:700;padding:1px 6px;border:2px solid #fff}
  .panel{position:absolute;right:0;top:46px;width:min(420px,88vw);background:#fff;border:1px solid var(--gray2);
    border-radius:var(--r-12);box-shadow:0 12px 32px rgba(0,0,0,.16);display:none;z-index:40;overflow:hidden}
  .panel.on{display:block}
  .panel .ph{display:flex;align-items:center;gap:var(--sp-12);padding:var(--sp-12) var(--sp-16);
    border-bottom:1px solid var(--gray2)}
  .panel .ph b{font-size:var(--fs-14)}
  .panel .ph .mark{margin-left:auto;font-size:var(--fs-12);color:var(--blue);cursor:pointer;background:none;border:0}
  .panel .ph .mark:hover{text-decoration:underline}
  .ntabs{display:flex;gap:var(--sp-4);padding:0 var(--sp-12);border-bottom:1px solid var(--gray2)}
  .ntabs button{border:0;background:none;padding:var(--sp-8) var(--sp-12);font-size:var(--fs-12);color:var(--gray6);
    border-bottom:2px solid transparent;margin-bottom:-1px}
  .ntabs button.on{color:var(--blue);border-bottom-color:var(--blue);font-weight:600}
  .nlist{max-height:340px;overflow:auto}
  .n{display:flex;gap:var(--sp-12);padding:var(--sp-12) var(--sp-16);border-bottom:1px solid var(--gray1);
    text-decoration:none;color:inherit}
  .n:last-child{border-bottom:0}
  .n:hover{background:var(--gray0)}
  .n.unread{background:var(--blue-l)}
  .n.unread:hover{background:#d4e9fb}
  .n .dot{width:8px;height:8px;border-radius:50%;background:var(--blue);flex:none;margin-top:6px}
  .n.read .dot{background:transparent}
  .n .txt{flex:1;min-width:0}
  .n b{font-size:var(--fs-14);font-weight:600;display:block;line-height:1.35}
  .n .sub{font-size:var(--fs-12);color:var(--gray6);margin-top:2px;line-height:1.45}
  .n .when{font-size:var(--fs-12);color:var(--gray5);margin-top:3px}
  .panel .pf{padding:var(--sp-12) var(--sp-16);border-top:1px solid var(--gray2);text-align:center}
  .panel .pf a{font-size:var(--fs-14);color:var(--blue);text-decoration:none}
  .nempty{padding:var(--sp-32) var(--sp-20);text-align:center;color:var(--gray5);font-size:var(--fs-14);line-height:1.6}
</style>
</head>
<body>

<div class="demo-bar">
  <span><i>(демо)</i> страница</span>
  <select id="st" onchange="render()">
    <option value="404">404 — не найдено</option>
    <option value="403">403 — нет доступа</option>
    <option value="500">500 — сбой</option>
    <option value="grace">Деградация: grace</option>
    <option value="blocked">Деградация: /manage отключено</option>
    <option value="suspended">Деградация: заглушка</option>
    <option value="bell">Панель колокольчика</option>
  </select>
</div>

<div id="root"></div>
<div class="toast" id="toast"></div>

<script>
/* Служебные страницы и режим деградации при неоплате (02-tech §17).
   Ступени состояния инстанса: active → grace (14 дней) → admin_blocked (30 дней:
   /manage выключен, /learn работает) → suspended (заглушка). */
function v(id){ return document.getElementById(id); }

function render(){
  var s = v('st').value;
  v('root').innerHTML =
    s === '404' ? err404() : s === '403' ? err403() : s === '500' ? err500() :
    s === 'grace' ? frame('grace') : s === 'blocked' ? frame('blocked') :
    s === 'suspended' ? suspended() : frame('bell');
  if(s === 'bell') setTimeout(function(){ v('panel').classList.add('on'); }, 0);
}

/* ── ошибки: у каждой свой выход, а не только «назад» ── */
function errPage(cls, ic, code, h1, text, acts, ref){
  return '<div class="stage"><div class="err-card">' +
    '<div class="ill ' + cls + '">' + ic + '</div>' +
    '<div class="code">' + code + '</div>' +
    '<h1>' + h1 + '</h1><p>' + text + '</p>' +
    '<div class="acts">' + acts + '</div>' +
    (ref ? '<div class="ref">' + ref + '</div>' : '') +
    '</div></div>';
}
function err404(){
  return errPage('', '⌕', '404', 'Страница не найдена',
    'Ссылка устарела или в адресе опечатка. Если вы пришли по ссылке из письма — возможно, запись уже удалили ' +
    'или перенесли в другую группу.',
    '<a class="btn btn-p" href="10-home.html">На главную</a>' +
    '<button class="btn" onclick="toast(\'Возврат на предыдущий экран\')">Назад</button>');
}
function err403(){
  /* 403 всегда называет область и того, к кому идти: иначе человек идёт «куда-нибудь» */
  return errPage('warn', '⊘', '403', 'Нет доступа к этому разделу',
    'Раздел «Финансы» относится к другой области работы. Доступ выдаёт владелец школы — ' +
    'напишите ему, если это ваша задача.',
    '<a class="btn btn-p" href="10-home.html">На главную</a>' +
    '<button class="btn" onclick="toast(\'Письмо владельцу с указанием раздела\')">Запросить доступ</button>',
    'Если вы уверены, что доступ был: возможно, изменились роли — это видно в журнале доступа.');
}
function err500(){
  return errPage('stop', '!', '500', 'Что-то сломалось на нашей стороне',
    'Мы уже знаем о сбое — он записан автоматически. Данные, которые вы вводили, не потеряны: ' +
    'ответы и черновики сохраняются по мере ввода.',
    '<button class="btn btn-p" onclick="toast(\'Перезагрузка страницы\')">Обновить страницу</button>' +
    '<a class="btn" href="10-home.html">На главную</a>',
    'Код обращения — <code>err_9f3c21</code>. Назовите его в поддержке, если сбой повторится.');
}

/* ── деградация: рабочая рамка, чтобы было видно, что именно выключено ── */
function frame(mode){
  var blocked = mode === 'blocked';
  var items = [
    ['◱','Главная','10-home.html', blocked],
    ['▦','Журнал','04-journal.html', blocked],
    ['◉','Группы','07-student.html#pick', blocked],
    ['₽','Лицевые счета','24-finance.html', blocked],
    ['⚙','Настройки','26-settings-learning.html', blocked]
  ];
  var learn = [['◈','Мои курсы','18-student-courses.html', false],['◷','Календарь','16-student-calendar.html', false]];

  return '<div class="shell-demo">' +
    '<aside class="side-demo">' +
      '<div class="side-top-demo"><span class="logo">ШБ</span>' +
        '<span><b style="font-size:var(--fs-14);display:block">Шаг в будущее</b>' +
        '<small style="font-size:var(--fs-12);color:var(--gray6)">' + (blocked ? 'Обучение' : 'Управление') + '</small></span></div>' +
      '<nav class="nav-demo">' +
        '<h4>Управление</h4>' +
        items.map(function(i){
          return i[3]
            ? '<a class="off" title="Раздел недоступен до оплаты подписки"><i>' + i[0] + '</i>' + i[1] +
              '<span class="lockic">🔒</span></a>'
            : '<a href="' + i[2] + '"><i>' + i[0] + '</i>' + i[1] + '</a>';
        }).join('') +
        '<h4>Обучение</h4>' +
        learn.map(function(i){ return '<a href="' + i[2] + '"><i>' + i[0] + '</i>' + i[1] + '</a>'; }).join('') +
      '</nav>' +
    '</aside>' +
    '<div class="app-demo">' +
      '<header class="head-demo"><h1>' + (blocked ? 'Мои курсы' : 'Главная') + '</h1>' +
        bell() + '</header>' +
      '<div class="body-demo">' + body(mode) + '</div>' +
    '</div></div>';
}

function body(mode){
  if(mode === 'grace')
    return '<div class="banner warn"><span class="ic">⚠</span><span>' +
      '<b>Подписка не продлена. Осталось 12 дней обычной работы.</b>' +
      'Дальше закроется «Управление» — журналы, финансы и настройки; ученики продолжат учиться в любом случае. ' +
      'Счёт и реквизиты — в разделе «Поддержка», там же можно написать вендору.</span></div>' +
      '<div class="card"><h3>Занятий сегодня</h3><p>Работа идёт как обычно: на этой ступени ничего не отключено, ' +
      'плашка висит на всех экранах «Управления», чтобы владелец увидел её вовремя.</p></div>';

  if(mode === 'blocked')
    return '<div class="banner stop"><span class="ic">🔒</span><span>' +
      '<b>«Управление» отключено до оплаты подписки.</b>' +
      'Обучение работает: ученики и родители заходят в кабинет, открывают материалы, сдают работы и видят расписание. ' +
      'Данные на месте — оплата возвращает доступ сразу, без восстановления.</span></div>' +
      '<div class="card"><h3>Мои курсы</h3><p>Это пространство «Обучение» — оно живёт по другому адресу (<code>/learn</code>), ' +
      'поэтому не выключается вместе с рабочими разделами.</p></div>' +
      '<div class="card muted-block"><h3>Журнал группы МЕГЭ-1</h3><p>Раздел недоступен на этой ступени.</p></div>';

  return '<div class="card"><h3>Панель уведомлений</h3><p>Колокольчик в шапке: счётчик непрочитанного, ' +
    'две вкладки и переход в полный список. Открыт справа сверху.</p></div>';
}

function suspended(){
  /* Заглушка отдаётся nginx: приложения на этой ступени уже нет — значит, ни меню, ни колокольчика */
  return errPage('info', '⏸', '', 'Платформа временно недоступна',
    'Школа «Шаг в будущее» приостановила подписку. Все данные сохранены — обучение возобновится сразу после оплаты.',
    '<button class="btn btn-p" onclick="toast(\'Контакты школы\')">Связаться со школой</button>',
    'Если вы владелец школы — напишите вендору, доступ вернётся в течение рабочего дня.');
}

/* ── колокольчик ── */
var NOTIF = [
  {t:'Работа проверена', s:'СР «Системы уравнений» — 8 из 10, есть комментарий', w:'12 минут назад', unread:true, act:true},
  {t:'Вернули на доработку', s:'ДЗ «Функции»: «В задаче 14 потеряна вторая ветка модуля»', w:'сегодня, 10:20', unread:true, act:true},
  {t:'Открылся новый урок', s:'«Прогрессии» — доступен до 09.10', w:'сегодня, 09:00', unread:true, act:false},
  {t:'Занятие перенесено', s:'МЕГЭ-1: 29.09 → 30.09, 17:00, каб. 315', w:'вчера, 18:40', unread:false, act:false},
  {t:'Начислена оплата', s:'Абонемент за октябрь — 7 500 ₽, срок до 05.10', w:'вчера, 09:00', unread:false, act:true}
];
var ntab = 0;

function bell(){
  var n = NOTIF.filter(function(x){ return x.unread; }).length;
  return '<div class="bell-wrap">' +
    '<button class="bell" onclick="v(\'panel\').classList.toggle(\'on\')">🔔' +
      (n ? '<span class="cnt">' + n + '</span>' : '') + '</button>' +
    '<div class="panel" id="panel">' +
      '<div class="ph"><b>Уведомления</b>' +
        '<button class="mark" onclick="readAll()">Прочитать все</button></div>' +
      '<div class="ntabs">' +
        '<button class="' + (ntab === 0 ? 'on' : '') + '" onclick="setNtab(0)">Все</button>' +
        '<button class="' + (ntab === 1 ? 'on' : '') + '" onclick="setNtab(1)">Требуют действия</button>' +
      '</div>' +
      '<div class="nlist">' + nlist() + '</div>' +
      '<div class="pf"><a href="#" onclick="event.preventDefault();toast(\'Полный список уведомлений\')">Все уведомления</a></div>' +
    '</div></div>';
}
function nlist(){
  var list = ntab === 0 ? NOTIF : NOTIF.filter(function(x){ return x.act; });
  if(!list.length)
    return '<div class="nempty">Ничего не ждёт вашего действия.<br>Сюда попадают проверки, доработки и оплаты.</div>';
  return list.map(function(x){
    return '<a class="n ' + (x.unread ? 'unread' : 'read') + '" href="#" ' +
      'onclick="event.preventDefault();open1(\'' + x.t + '\')">' +
      '<span class="dot"></span><span class="txt"><b>' + x.t + '</b>' +
      '<span class="sub">' + x.s + '</span><span class="when">' + x.w + '</span></span></a>';
  }).join('');
}
function setNtab(i){ ntab = i; refreshBell(); }
function readAll(){
  NOTIF.forEach(function(x){ x.unread = false; });
  refreshBell();
  toast('Все отмечены прочитанными — счётчик исчез');
}
function open1(t){
  NOTIF.forEach(function(x){ if(x.t === t) x.unread = false; });
  refreshBell();
  toast('Переход к объекту уведомления: ' + t.toLowerCase());
}
function refreshBell(){
  var was = v('panel') && v('panel').classList.contains('on');
  var w = document.querySelector('.bell-wrap');
  if(!w) return;
  w.outerHTML = bell();
  if(was) v('panel').classList.add('on');
}

var tt;
function toast(m){
  var t = v('toast'); t.textContent = m; t.classList.add('on');
  clearTimeout(tt); tt = setTimeout(function(){ t.classList.remove('on'); }, 3600);
}

render();
</script>
</body>
</html>
