<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Календарь ученика — FS-LMS 2.0</title>
<link rel="stylesheet" href="_shared.css">
<script src="_tip.js"></script>
<script src="_nav.js"></script>
<style>
  /* календарь занимает всю высоту между шапкой (--head-h) и низом контента (--user-h) */
  .body{flex:1;min-height:0;display:flex;flex-direction:column;padding:var(--sp-16) var(--sp-20) var(--user-h)}
  .card{background:#fff;border:1px solid var(--gray2);border-radius:var(--r-12);box-shadow:var(--sh);margin-bottom:var(--sp-12)}
  .sec-h{display:flex;align-items:center;gap:var(--sp-12);padding:var(--sp-12) var(--sp-16);
    border-bottom:1px solid var(--gray2);flex-wrap:wrap}
  .sec-h h3{margin:0;font-size:var(--fs-14)}
  /* селектор в шапке — одной высоты во всех экранах, чтобы шапка была ровно --head-h */
  .pick{display:flex;align-items:center;gap:var(--sp-8);height:38px;padding:0 var(--sp-12);
    border:1px solid var(--gray3);border-radius:var(--r-8);font-size:var(--fs-14);color:var(--gray7);
    background:#fff;cursor:pointer}
  .pick:hover{background:var(--gray0)}
  .modes{display:flex;gap:var(--sp-4);background:var(--gray1);padding:var(--sp-4);border-radius:var(--r-8);font-size:var(--fs-12)}
  .modes button{border:0;background:none;padding:var(--sp-4) var(--sp-12);border-radius:var(--r-6);color:var(--gray6)}
  .modes button.on{background:#fff;box-shadow:var(--sh);color:var(--gray9);font-weight:600}

  .cols{flex:1;min-height:0;display:grid;grid-template-columns:1fr var(--col-300);gap:var(--sp-12);align-items:stretch}
  .cols > div{min-height:0;display:flex;flex-direction:column}
  .cols .card.grow{flex:1;min-height:0;display:flex;flex-direction:column;margin-bottom:0}
  .cols .card.grow .sec-h{flex:none}
  #cal{flex:1;min-height:0;overflow:auto}

  /* месяц */
  /* высота строки — по самому загруженному дню в ней; при пустом месяце сетка тянется на всю карточку */
  .mgrid{display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:minmax(104px,auto);min-height:100%}
  /* шапка дней недели совпадает по высоте с шапкой карточки — сетка читается одной линией */
  .wd{height:56px;display:grid;place-items:center;font-size:var(--fs-12);color:var(--gray6);font-weight:600;
    border-bottom:1px solid var(--gray2)}
  .day{border-right:1px solid var(--gray1);border-bottom:1px solid var(--gray1);padding:var(--sp-6);
    position:relative;display:flex;flex-direction:column;gap:var(--sp-6)}
  .day .evs{display:flex;flex-direction:column;gap:var(--sp-6)}
  .day:nth-child(7n){border-right:0}
  .day.out{background:var(--gray0)}
  .day.today{background:var(--blue-l)}
  .day .n{font-size:var(--fs-12);color:var(--gray6);font-weight:600}
  .day.today .n{color:var(--blue)}
  .day .n .hol{color:#c92a2a;font-weight:400;margin-left:var(--sp-4)}
  .ev{display:block;width:100%;text-align:left;border:0;border-left:3px solid var(--blue);background:var(--gray0);
    border-radius:var(--r-6);padding:var(--sp-6) var(--sp-8);font-size:var(--fs-12);
    line-height:1.45;min-height:32px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:none}
  .ev:hover{background:var(--gray1)}
  .ev.ind{border-left-color:var(--violet)}
  .ev.due{border-left-color:var(--red);background:var(--red-l)}
  .ev.exam{border-left-color:#c92a2a;background:#ffe3e3;font-weight:600}
  .ev b{font-variant-numeric:tabular-nums;margin-right:var(--sp-4)}

  /* неделя списком */
  .dayrow{border-top:1px solid var(--gray1)}
  .dayrow:first-of-type{border-top:0}
  .dayhead{padding:var(--sp-8) var(--sp-16);background:var(--gray0);font-size:var(--fs-12);color:var(--gray6);font-weight:600}
  .dayhead.today{background:var(--blue-l);color:var(--blue)}
  .item{display:flex;gap:var(--sp-12);padding:var(--sp-12) var(--sp-16);border-top:1px solid var(--gray1)}
  .item:hover{background:var(--gray0)}
  .item .time{width:var(--col-92);flex:none;font-size:var(--fs-12);color:var(--gray7);font-variant-numeric:tabular-nums}
  .item .time b{display:block;font-size:var(--fs-14)}
  .item .line{width:3px;border-radius:2px;background:var(--blue);flex:none}
  .item.ind .line{background:var(--violet)}
  .item.due .line{background:var(--red)}
  .item .info{flex:1;min-width:0}
  .item .info b{font-size:var(--fs-14);display:block}
  .item .info .sub{font-size:var(--fs-12);color:var(--gray6);margin-top:2px}
  .item .acts{display:flex;gap:var(--sp-6);margin-top:var(--sp-8);flex-wrap:wrap}

  /* ближайшее */
  .next{padding:var(--sp-12) var(--sp-16);border-top:1px solid var(--gray1)}
  .next:first-of-type{border-top:0}
  .next .w{font-size:var(--fs-12);color:var(--gray6)}
  .next b{font-size:var(--fs-14);display:block;margin:2px 0}
  .next .when{font-size:var(--fs-12);font-weight:700}
  .when.red{color:#c92a2a} .when.orange{color:#d9480f} .when.gray{color:var(--gray6)}
  .legend{display:flex;gap:var(--sp-12);font-size:var(--fs-12);color:var(--gray6);flex-wrap:wrap}
  .legend i{display:inline-block;width:11px;height:11px;border-radius:var(--r-4);margin-right:var(--sp-6);vertical-align:-1px}
  .empty{padding:var(--sp-32) var(--sp-16);text-align:center;color:var(--gray6);font-size:var(--fs-14)}
  .empty b{display:block;color:var(--gray9);margin-bottom:var(--sp-4)}
  .demo{display:flex;align-items:center;gap:var(--sp-6);font-size:var(--fs-12);color:var(--gray6)}
  @media (max-width:1100px){ .cols{grid-template-columns:1fr} }
</style>
</head>
<body>
<div class="shell">
  <aside class="side" id="side">
    <div class="side-top">
      <div class="logo">ШБ</div>
      <div style="flex:1"><b>Шаг в будущее</b><small id="sideSub">Личный кабинет</small></div>
      <button class="collapse-btn" onclick="document.getElementById('side').classList.toggle('collapsed')">⟨</button>
    </div>
    <nav class="nav">
      <h4>Меню</h4>
      <a href="11-student-home.html"><i class="ic">◱</i><span>Главная</span></a>
      <a href="18-student-courses.html"><i class="ic">◈</i><span>Мои курсы</span></a>
      <a href="#" class="on"><i class="ic">◷</i><span>Календарь</span></a>
      <a href="17-student-results.html"><i class="ic">▦</i><span>Результаты</span></a>
      <a href="#"><i class="ic">₽</i><span>Лицевой счёт</span></a>
    </nav>
    <div class="side-user">
      <div class="ava" id="ava" style="background:var(--blue)">АК</div>
      <div style="flex:1"><b style="font-size:var(--fs-14);display:block" id="userName">Абрамов Кирилл</b>
        <small style="font-size:var(--fs-12);color:var(--gray6)" id="userRole">Ученик</small></div>
      <span style="color:var(--gray5)">⚙</span>
    </div>
  </aside>

  <div class="app">
    <header class="head">
      <h1>Календарь</h1>
      <button class="pick" onclick="toast('Переключение месяца')">Август 2026 <span style="color:var(--gray5)">▾</span></button>
      <button class="pick" id="childPick" onclick="toast('Второй ребёнок: Абрамова Полина · МЕГЭ-2')" style="display:none">
        <span style="width:22px;height:22px;border-radius:50%;background:var(--blue);color:#fff;font-size:9px;display:grid;place-items:center;font-weight:700">АК</span>
        Кирилл <span style="color:var(--gray5)">▾</span></button>
      <div class="sp"></div>
      <label class="demo">роль <i>(демо)</i>
        <select id="role" onchange="render()" style="padding:var(--sp-4) var(--sp-8);font-size:var(--fs-12)">
          <option value="student">Ученик</option>
          <option value="parent">Представитель</option>
        </select></label>

      <label class="demo">кабинет <i>(демо)</i>
        <select id="mode" onchange="render()" style="padding:var(--sp-4) var(--sp-8);font-size:var(--fs-12)">
          <option value="campus">кампус (группа)</option>
          <option value="online">онлайн (купленные курсы)</option>
        </select></label>
      <span style="color:var(--gray5)">🔔</span>
    </header>

    <div class="body">
      <div class="cols">
        <div>
          <div class="card grow">
            <div class="sec-h">
              <h3>Август 2026</h3>
              <span class="muted" id="sum" style="font-size:var(--fs-12)"></span>
              <div style="flex:1"></div>
              <div class="modes" id="viewMode">
                <button class="on" onclick="setView('month',this)">Месяц</button>
                <button onclick="setView('week',this)">Неделя</button>
              </div>
            </div>
            <div id="cal"></div>
            <div class="sec-h" style="border-bottom:0;border-top:1px solid var(--gray2);flex:none">
              <div class="legend" id="legend"></div>
            </div>
          </div>
        </div>

        <div>
          <div class="card">
            <div class="sec-h"><h3>Ближайшее</h3><span class="muted" id="nextCnt" style="font-size:var(--fs-12)"></span></div>
            <div id="next"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
/* Календарь ученика показывает и занятия, и сроки: для него это один поток дел.
   У онлайн-ученика занятий нет — остаются дедлайны и открытия уроков. */
var EVENTS = {
  4:  [{t:'15:00', n:'Математика · МЕГЭ-1', k:'g', room:'каб. 315', topic:'Повторение: дроби', teacher:'Училков И. С.'}],
  6:  [{t:'15:00', n:'Математика · МЕГЭ-1', k:'g', room:'каб. 315', topic:'Проценты', teacher:'Училков И. С.'},
       {t:'23:59', n:'ДЗ «Проценты»', k:'due', work:true}],
  8:  [{t:'17:00', n:'Информатика · ОГЭ-1', k:'g', room:'трансляция', topic:'Массивы', teacher:'Петрова А. В.'}],
  11: [{t:'15:00', n:'Математика · МЕГЭ-1', k:'g', room:'каб. 315', topic:'Системы уравнений', teacher:'Училков И. С.'},
       {t:'19:00', n:'Индивидуальное занятие', k:'i', room:'каб. 302', topic:'Отработка: линейные уравнения', teacher:'Училков И. С.'}],
  12: [{t:'15:00', n:'Математика · МЕГЭ-1', k:'g', room:'каб. 315', topic:'Квадратные уравнения', teacher:'Училков И. С.', now:true},
       {t:'17:00', n:'Информатика · ОГЭ-1', k:'g', room:'трансляция', topic:'Циклы', teacher:'Петрова А. В.', live:true},
       {t:'23:59', n:'ДЗ «Степени и корни»', k:'due', work:true}],
  13: [{t:'15:00', n:'Математика · МЕГЭ-1', k:'g', room:'каб. 315', topic:'Неравенства', teacher:'Училков И. С.'}],
  15: [{t:'15:00', n:'Математика · МЕГЭ-1', k:'g', room:'каб. 315', topic:'Функции и графики', teacher:'Училков И. С.'},
       {t:'23:59', n:'СР «Функции»', k:'due', work:true}],
  18: [{t:'15:00', n:'Экзамен по математике', k:'exam', room:'60 минут · одна попытка', topic:'Итоговый экзамен курса'}],
  20: [{t:'17:00', n:'Информатика · ОГЭ-1', k:'g', room:'каб. 210', topic:'Функции', teacher:'Петрова А. В.'}]
};
/* онлайн-кабинет: только сроки и открытия уроков */
var ONLINE = {
  6:  [{t:'23:59', n:'ДЗ «Проценты»', k:'due', work:true}],
  12: [{t:'23:59', n:'ДЗ «Степени и корни»', k:'due', work:true}],
  14: [{t:'—', n:'Откроется урок 9 «Прогрессии»', k:'open'}],
  15: [{t:'23:59', n:'СР «Функции»', k:'due', work:true}],
  21: [{t:'—', n:'Откроется урок 10 «Текстовые задачи»', k:'open'}]
};
var TODAY = 12, view = 'month';

function data(){ return document.getElementById('mode').value === 'online' ? ONLINE : EVENTS; }
function setView(v, el){
  view = v;
  [].forEach.call(document.querySelectorAll('#viewMode button'), function(b){ b.classList.remove('on'); });
  el.classList.add('on');
  render();
}

function evClass(e){ return e.k === 'due' ? 'due' : e.k === 'exam' ? 'exam' : e.k === 'i' ? 'ind' : ''; }
function open(d, i){
  var e = data()[d][i];
  toast(e.k === 'due' ? 'Работа: ' + e.n + ' — сдать до ' + e.t
      : e.k === 'open' ? e.n
      : e.n + ' · ' + e.t + ' · ' + (e.room || ''));
}

function render(){
  var ev = data(), online = document.getElementById('mode').value === 'online';
  document.getElementById('sideSub').textContent = online ? 'Онлайн-курсы' : 'Личный кабинет';

  var lessons = 0, dues = 0;
  Object.keys(ev).forEach(function(d){
    ev[d].forEach(function(e){ if(e.k === 'due') dues++; else if(e.k !== 'open') lessons++; });
  });
  document.getElementById('sum').textContent = online
    ? dues + ' срока сдачи в месяце'
    : lessons + ' занятий · ' + dues + ' сроков сдачи';

  document.getElementById('legend').innerHTML = (online ? '' :
      '<span><i style="background:var(--blue)"></i>занятие группы</span>' +
      '<span><i style="background:var(--violet)"></i>индивидуальное</span>' +
      '<span><i style="background:#c92a2a"></i>экзамен</span>') +
    '<span><i style="background:var(--red)"></i>срок сдачи работы</span>' +
    (online ? '<span><i style="background:var(--gray3)"></i>открытие урока</span>' : '');

  /* месяц: 1 августа 2026 — суббота, поэтому первые пять клеток пустые */
  if(view === 'month'){
    var html = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(function(d){ return '<div class="wd">'+d+'</div>'; }).join('');
    for(var i = 0; i < 5; i++) html += '<div class="day out"></div>';
    for(var d = 1; d <= 31; d++){
      var list = ev[d] || [];
      var hol = (d === 22) ? '<span class="hol">каникулы</span>' : '';
      html += '<div class="day '+(d === TODAY ? 'today' : '')+'">' +
        '<div class="n">'+d+hol+'</div>' +
        (list.length ? '<div class="evs">' + list.map(function(e, i){
          return '<button class="ev '+evClass(e)+'" onclick="open('+d+','+i+')" title="'+e.n+'">' +
            (e.t !== '—' ? '<b>'+e.t+'</b>' : '') + e.n + '</button>';
        }).join('') + '</div>' : '') + '</div>';
    }
    document.getElementById('cal').innerHTML = '<div class="mgrid">' + html + '</div>';
  } else {
    /* неделя: тот же список, но с деталями и действиями */
    var days = [11,12,13,14,15,16,17], out = '';
    days.forEach(function(d){
      var list = ev[d] || [];
      out += '<div class="dayrow"><div class="dayhead '+(d === TODAY ? 'today' : '')+'">' +
        (d === TODAY ? 'Сегодня, ' : '') + d + ' августа</div>' +
        (list.length ? list.map(function(e, i){
          return '<div class="item '+evClass(e)+'">' +
            '<span class="time"><b>'+e.t+'</b></span><span class="line"></span>' +
            '<span class="info"><b>'+e.n+(e.now?' <span style="color:var(--blue)">· идёт сейчас</span>':'')+'</b>' +
            '<span class="sub">'+[e.teacher, e.room, e.topic].filter(Boolean).join(' · ')+'</span>' +
            '<span class="acts">' +
              (e.live ? '<button class="btn btn-s btn-p" data-act onclick="toast(\'Подключение к трансляции\')">Подключиться</button>' : '') +
              (e.work ? '<a class="btn btn-s btn-p" data-act href="02-player.html">Открыть работу</a>' : '') +
              (e.k === 'exam' ? '<a class="btn btn-s btn-p" data-act href="12-exam.html">К экзамену</a>' : '') +
              (e.k === 'g' || e.k === 'i' ? '<a class="btn btn-s" href="02-player.html">Материалы урока</a>' : '') +
            '</span></span></div>';
        }).join('') : '<div class="empty" style="padding:var(--sp-16)">свободный день</div>') + '</div>';
    });
    document.getElementById('cal').innerHTML = out;
  }

  /* ближайшее — то, что требует действия, а не просто следующее по времени */
  var near = [
    {w:'Сегодня, 23:59', n:'ДЗ «Степени и корни»', s:'не сдано · 4 задания', cls:'red', act:'Открыть'},
    {w:'15 августа', n:'СР «Функции и графики»', s:'откроется после занятия', cls:'gray', act:''},
    {w:'18 августа', n:'Экзамен по математике', s:'60 минут · одна попытка', cls:'orange', act:'Условия'}
  ];
  if(!online) near.splice(1, 0, {w:'Сегодня, 17:00', n:'Информатика · ОГЭ-1', s:'трансляция · Циклы', cls:'orange', act:'Подключиться'});
  document.getElementById('nextCnt').textContent = near.length;
  document.getElementById('next').innerHTML = near.map(function(n){
    return '<div class="next"><span class="when '+n.cls+'">'+n.w+'</span>' +
      '<b>'+n.n+'</b><span class="w">'+n.s+'</span>' +
      (n.act ? '<div style="margin-top:var(--sp-8)"><button class="btn btn-s" onclick="toast(\''+n.act+'\')">'+n.act+'</button></div>' : '') +
      '</div>';
  }).join('');
  if(typeof applyRole === 'function') applyRole();
}


/* Представитель видит те же вкладки, что ученик, но ничего не делает за него:
   действия остаются на месте и гаснут — так видно, что кнопка существует (01-product §3.8). */
function isParent(){ var r = document.getElementById('role'); return r && r.value === 'parent'; }
function applyRole(){
  var p = isParent();
  var nm = document.getElementById('userName'), rl = document.getElementById('userRole'), av = document.getElementById('ava');
  if(nm) nm.textContent = p ? 'Абрамова Елена' : 'Абрамов Кирилл';
  if(rl) rl.textContent = p ? 'Представитель' : 'Ученик';
  if(av){ av.textContent = p ? 'АЕ' : 'АК'; av.style.background = p ? 'var(--violet)' : 'var(--blue)'; }
  var sub = document.getElementById('sideSub');
  if(sub && sub.textContent !== 'Онлайн-курсы') sub.textContent = p ? 'Кабинет представителя' : 'Личный кабинет';
  var cp = document.getElementById('childPick');
  if(cp) cp.style.display = p ? '' : 'none';
  /* кнопки-действия ученика остаются видимыми, но выключаются */
  [].forEach.call(document.querySelectorAll('[data-act]'), function(b){
    /* ссылка не понимает disabled — гасим её классом, кнопку по-прежнему атрибутом */
    if(b.tagName === 'A') b.classList.toggle('is-off', p); else b.disabled = p;
    b.title = p ? 'Действие доступно ученику — представитель наблюдает' : '';
  });
}
var tt;
function toast(m){ var t = document.getElementById('toast'); t.textContent = m; t.classList.add('on');
  clearTimeout(tt); tt = setTimeout(function(){ t.classList.remove('on'); }, 3200); }
render();
applyRole();
</script>
</body>
</html>
